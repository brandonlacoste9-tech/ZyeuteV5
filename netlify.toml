# Zyeuté V5 — Netlify (frontend SPA)
# Backend stays on Render / Cloudflare Worker. This file only hosts the Vite app.

[build]
  command = "npm run build:vercel"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_OPTIONS = "--max-old-space-size=4096"
  CI = "true"

# Same /api proxy as vercel.json — relative fetch() in the SPA hits the edge worker.
[[redirects]]
  from = "/api/*"
  to = "https://zyeute-edge.brandonlacoste9.workers.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/vite-hmr"
  to = "/index.html"
  status = 404

# Client-side router (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
